go{background:#f2b33d;color:#141a2e;font-weight:700;flex:1}.s{margin-top:6px;font-size:12px;color:#9aa3c2;line-height:1.5}.hid{display:none}.lr{margin-top:6px;font-size:12px;color:#f2b33d;line-height:1.5}&lt;/style&gt;&lt;div class="bx"&gt;&lt;div class="t"&gt;秒押し：「'+KW+'」ボタン&lt;/div&gt;&lt;div class="now" id="n"&gt;&lt;/div&gt;&lt;div class="whl" id="w"&gt;&lt;/div&gt;&lt;div class="r"&gt;&lt;button id="kb"&gt;⌨ 数字で入力&lt;/button&gt;&lt;button class="go" id="g"&gt;予約&lt;/button&gt;&lt;button id="x"&gt;×&lt;/button&gt;&lt;/div&gt;&lt;div class="r hid" id="kr"&gt;&lt;input id="ki" inputmode="numeric" placeholder="例 120000000（12:00:00.000）"&gt;&lt;button id="ko"&gt;OK&lt;/button&gt;&lt;/div&gt;&lt;div class="r"&gt;&lt;input id="ad" inputmode="numeric" placeholder="早め（ミリ秒）0"&gt;&lt;button id="ms"&gt;遅れを測る&lt;/button&gt;&lt;/div&gt;&lt;div class="lr" id="lr"&gt;&lt;/div&gt;&lt;div class="r hid" id="rs"&gt;&lt;button id="rw" style="flex:1"&gt;当たり🎯&lt;/button&gt;&lt;button id="rl" style="flex:1"&gt;はずれ&lt;/button&gt;&lt;/div&gt;&lt;div class="s" id="s"&gt;押す時刻を回して「予約」。応募画面（「'+KW+'」ボタンがある画面）を開いたままにしてください。&lt;/div&gt;&lt;/div&gt;'; var $=function(i){return R.getElementById(i);}; function T(){return Date.now()+off;} function p2(n,l){n=String(n);while(n.length&lt;l)n='0'+n;return n;} function fm(t){var x=new Date(t);return p2(x.getHours(),2)+':'+p2(x.getMinutes(),2)+':'+p2(x.getSeconds(),2)+'.'+p2(x.getMilliseconds(),3);} function say(s){$('s').textContent=s;} function wheel(n,cls){var cp=Math.max(5,Math.ceil(240/n));if(cp%2===0)cp++;var base=Math.floor(cp/2)*n,len=n*cp;var col=document.createElement('div');col.className='col'+(cls?' '+cls:'');var a=document.createElement('i');col.appendChild(a);for(var k=0;k&lt;len;k++){var it=document.createElement('b');it.textContent=k%n;col.appendChild(it);}var z=document.createElement('i');col.appendChild(z);var bs=col.getElementsByTagName('b');var w={v:0,i:base};function hl(){for(var j=Math.max(0,w.i-4);j&lt;=Math.min(len-1,w.i+4);j++)bs[j].className=j===w.i?'on':'';}w.set=function(v){w.v=(+v||0)%n;w.i=base+w.v;col.scrollTop=w.i*IH;for(var j=0;j&lt;len;j++)bs[j].className='';hl();};var tm=0;col.addEventListener('scroll',function(){var i=Math.max(0,Math.min(len-1,Math.round(col.scrollTop/IH)));if(i!==w.i){var old=w.i;w.i=i;if(bs[old])bs[old].className='';hl();w.v=i%n;}clearTimeout(tm);tm=setTimeout(function(){if(Math.abs(col.scrollTop-w.i*IH)&gt;1){col.scrollTop=w.i*IH;}else if(w.i&lt;n*2||w.i&gt;len-n*2){bs[w.i].className='';w.i=base+w.v;col.scrollTop=w.i*IH;hl();}},180);});col.addEventListener('click',function(e){var j=[].indexOf.call(bs,e.target);if(j&gt;=0){try{col.scrollTo({top:j*IH,behavior:'smooth'});}catch(x){col.scrollTop=j*IH;}}});$('w').appendChild(col);W.push(w);return w;} function lbl(t){var s=document.createElement('span');s.className='wl';s.textContent=t;$('w').appendChild(s);} wheel(24);lbl('時');wheel(60);lbl('分');wheel(6,'d');wheel(10,'d');lbl('秒');lbl('.');wheel(10,'d');wheel(10,'d');wheel(10,'d'); function setT(h,m,s,ms){W[0].set(h);W[1].set(m);W[2].set(Math.floor(s/10));W[3].set(s%10);W[4].set(Math.floor(ms/100));W[5].set(Math.floor(ms/10)%10);W[6].set(ms%10);} function getT(){var x=new Date(T());x.setHours(W[0].v,W[1].v,W[2].v*10+W[3].v,W[4].v*100+W[5].v*10+W[6].v);return x.getTime();} function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k));}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}} var lastR=ls(LK); function rline(){if(lastR&amp;&amp;lastR.at){$('lr').textContent='前回押した時刻 '+fm(lastR.at)+'（目標 '+fm(lastR.tgt)+'、早め '+lastR.adv+'ms'+(lastR.ow!=null?'、片道の目安 '+lastR.ow+'ms':'')+'）'+(lastR.res?' → '+lastR.res:'');}$('rs').className='r'+(lastR&amp;&amp;lastR.at&amp;&amp;!lastR.res?'':' hid');} function setRes(v,auto){lastR.res=v;ls(LK,lastR);var h=ls(HK)||[];for(var k=h.length-1;k&gt;=0;k--){if(h[k].at===lastR.at){h[k].res=v;break;}}ls(HK,h);rline();say((auto?'画面から読み取って':'')+'「'+v+'」と記録しました。');} $('rw').onclick=function(){setRes('当たり🎯');};$('rl').onclick=function(){setRes('はずれ');}; rline(); if(lastR&amp;&amp;lastR.at&amp;&amp;!lastR.res&amp;&amp;Date.now()-lastR.at&lt;6e5&amp;&amp;!find()){var tx=document.body.innerText||'';if(/ハズレ|はずれ/.test(tx)){setRes('はずれ',1);}else if(/おめでとう|当選しました/.test(tx)){setRes('当たり🎯',1);}} var nx=new Date(Date.now()+60000);setT(nx.getHours(),nx.getMinutes(),0,0); setInterval(function(){$('n').textContent=fm(T());},50); $('kb').onclick=function(){$('kr').classList.toggle('hid');}; $('ko').onclick=function(){var v=$('ki').value.replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);}).replace(/\D/g,'');if(v.length&lt;4||v.length&gt;9){say('数字は 時分（4桁）〜時分秒ミリ（9桁）で入れてください。例 120000000');return;}while(v.length&lt;9)v+='0';var h=+v.slice(0,2),m=+v.slice(2,4),s=+v.slice(4,6),ms=+v.slice(6,9);if(h&gt;23||m&gt;59||s&gt;59){say('時刻が正しくありません。');return;}setT(h,m,s,ms);$('kr').classList.add('hid');say('時刻を '+v.slice(0,2)+':'+v.slice(2,4)+':'+v.slice(4,6)+'.'+v.slice(6,9)+' にしました。');}; async function sync(){var best=null;for(var i=0;i&lt;5;i++){try{var a=Date.now(),pp=performance.now();var j=await (await fetch('https://dev.narikakun.net/webapi/ntp?ct='+a)).json();var rt=performance.now()-pp;if(j.serverTimestamp){var o=j.serverTimestamp-(a+rt/2);if(!best||rt&lt;best.r)best={o:o,r:rt};}}catch(e){}}if(best){off=Math.round(best.o);note='ネット時刻に補正（±'+Math.round(best.r/2)+'ms）';return true;}note='端末の時計のまま（補正できませんでした）';return false;} function find(){var c=[].slice.call(document.querySelectorAll('button,a,input[type=button],input[type=submit],[role=button]')).filter(function(e){var t=(e.innerText||e.value||e.textContent||'').replace(/\s/g,'');var r=e.getBoundingClientRect();return t.indexOf(KW)&gt;=0&amp;&amp;r.width&gt;0&amp;&amp;r.height&gt;0;});return c.length?c[c.length-1]:null;} $('ms').onclick=async function(){say('遅れを測っています…');var best=null;for(var i=0;i&lt;6;i++){try{var a=performance.now();await fetch(location.origin+'/favicon.ico?'+Math.random(),{cache:'no-store'});var r=performance.now()-a;if(best===null||r&lt;best)best=r;}catch(e){}}if(best===null){say('測れませんでした。');return;}ow=Math.round(best/2);$('ad').value=ow;say('往復 '+Math.round(best)+'ms、片道の目安 '+ow+'ms。「早め」に入れました（変えられます）。');}; $('x').onclick=function(){clearTimeout(timer);done=true;host.style.display='none';}; $('g').onclick=async function(){if(!find()){say('「'+KW+'」ボタンが見つかりません。応募画面を開いてから予約してください。');return;} var adv=Math.max(0,parseInt(String($('ad').value).replace(/[^\d]/g,''))||0); say('時刻を合わせています…');await sync();tgt=getT();var go=tgt-adv;if(go&lt;T()-1000){say('その時刻はもう過ぎています。');return;} try{if(navigator.wakeLock){navigator.wakeLock.request('screen').catch(function(){});}}catch(e){} clearTimeout(timer);done=false;say(note+'。'+fm(go)+' に押します（目標 '+fm(tgt)+'、早め '+adv+'ms）。画面を閉じず、このまま待ってください。押したあとは画面が切り替わるので、時刻は次に開いたとき「前回」に出ます。'); timer=setTimeout(async function(){if(done)return;await sync();var w=go-T()-40;if(T()-go&gt;300){say('時刻に遅れたため押しませんでした。');return;}if(w&gt;0){await new Promise(function(r){setTimeout(r,w);});}if(done)return;while(T()&lt;go){}var b=find();if(!b){say('ボタンが見つからず押せませんでした。');return;}done=true;var at=T();var rec={at:at,tgt:tgt,adv:adv,ow:ow,off:off,res:null};ls(LK,rec);ls(HK,(ls(HK)||[]).concat([rec]).slice(-30));b.click();say('押しました：'+fm(at)+'（目標 '+fm(tgt)+'）');},Math.max(0,go-T()-20000));}; window.__byo={show:function(){host.style.display='block';}};})();</textarea><br><button data-t="c2" type="button">コピー</button>
<h2>登録</h2>
<p><small>ブックマークのURLを、コピーしたコードに書き換えて保存（名前「秒押し」）</small></p>
<h2>使うとき</h2>
<p><small>外部ブラウザで「応募する」を表示→ブックマーク→時刻を回して「予約」。押したあと結果の画面でもう一度開くと、当たり🎯／はずれを記録できます。</small></p>
<script>[].forEach.call(document.querySelectorAll('button[data-t]'),function(b){b.onclick=function(){var t=document.getElementById(b.dataset.t);t.select();t.setSelectionRange(0,999999);var ok=false;try{ok=document.execCommand('copy');}catch(e){}if(!ok&&navigator.clipboard){navigator.clipboard.writeText(t.value);}b.textContent='✓ コピーしました';};});
document.getElementById('cw').onclick=function(){var u=this.dataset.u,b=this,ok=function(){b.textContent='✓ コピーしました';setTimeout(function(){b.textContent='URLをコピー';},1800);},fb=function(){var t=document.createElement('textarea');t.value=u;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok();}catch(e){prompt('このURLをコピーしてください',u);}document.body.removeChild(t);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(ok,fb);}else{fb();}};</script>
